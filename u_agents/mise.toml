# Task aliases for the u-agents runner.
#
# Run these from the u_agents/ directory (e.g. `mise run launcher-dry-run`).
# Each task sets `dir = ".."` so it runs from the dotfiles checkout root,
# where `python3 -m u_agents.*` can import the package.

[tasks.launcher-dry-run]
run = "python3 -m u_agents.launcher --dry-run"
dir = ".."

[tasks.launcher]
run = "python3 -m u_agents.launcher"
dir = ".."

[tasks.watchdog-dry-run]
run = "python3 -m u_agents.watchdog --once --dry-run"
dir = ".."

[tasks.watchdog]
run = "python3 -m u_agents.watchdog --once"
dir = ".."

[tasks.test]
run = "python3 -m unittest discover tests"
dir = ".."
