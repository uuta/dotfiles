# Task aliases for the u-agents runner.
#
# Run these from the u_agents/ directory (e.g. `mise run launcher-dry-run`).
# Python tasks set `dir = ".."` so `python -m u_agents.*` can import from the
# dotfiles checkout root. Runtime tasks source the same private env file used
# by interactive PM panes and default to the launchd venv with psycopg.
# Override the interpreter with U_AGENTS_PYTHON if needed.
# DB tasks set `dir = "."` so Docker Compose reads u_agents/compose.yml and
# its relative db/ init scripts.

[tasks.launcher-dry-run]
run = ". \"$HOME/.u_agents_env.zsh\" && \"${U_AGENTS_PYTHON:-$HOME/.local/share/u-agents/venv/bin/python}\" -m u_agents.launcher --dry-run"
dir = ".."

[tasks.launcher]
run = ". \"$HOME/.u_agents_env.zsh\" && \"${U_AGENTS_PYTHON:-$HOME/.local/share/u-agents/venv/bin/python}\" -m u_agents.launcher"
dir = ".."

[tasks.watchdog-dry-run]
run = ". \"$HOME/.u_agents_env.zsh\" && \"${U_AGENTS_PYTHON:-$HOME/.local/share/u-agents/venv/bin/python}\" -m u_agents.watchdog --once --dry-run"
dir = ".."

[tasks.watchdog]
run = ". \"$HOME/.u_agents_env.zsh\" && \"${U_AGENTS_PYTHON:-$HOME/.local/share/u-agents/venv/bin/python}\" -m u_agents.watchdog --once"
dir = ".."

[tasks.pr-watcher]
run = ". \"$HOME/.u_agents_env.zsh\" && \"${U_AGENTS_PYTHON:-$HOME/.local/share/u-agents/venv/bin/python}\" -m u_agents.pr_watcher --once"
dir = ".."

[tasks.test]
run = "\"${U_AGENTS_PYTHON:-$HOME/.local/share/u-agents/venv/bin/python}\" -m unittest discover tests"
dir = ".."

[tasks.db-up]
run = "docker compose -f compose.yml up -d --wait postgres"
dir = "."

[tasks.db-down]
run = "docker compose -f compose.yml down"
dir = "."

[tasks.db-psql]
run = "docker compose -f compose.yml exec postgres psql -U u_agents -d u_agents"
dir = "."
