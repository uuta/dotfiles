set -g mouse on

# Track when an attached client last viewed each window.  Pane output is not a
# useful proxy because terminal applications redraw after system wake.
set-hook -g 'after-new-window[90]' 'run-shell -b "tmux -S \"#{socket_path}\" set-option -w -t \"#{window_id}\" @last_viewed \"#{window_activity}\""'
set-hook -g 'client-attached[90]' 'run-shell -b "tmux -S \"#{socket_path}\" set-option -w -t \"#{window_id}\" @last_viewed \"#{client_activity}\""'
set-hook -g 'client-detached[90]' 'run-shell -b "tmux -S \"#{socket_path}\" set-option -w -t \"#{window_id}\" @last_viewed \"$(date +%s)\""'
set-hook -g 'client-session-changed[90]' 'run-shell -b "tmux -S \"#{socket_path}\" set-option -w -t \"#{window_id}\" @last_viewed \"#{client_activity}\""'
set-hook -g 'session-window-changed[90]' 'run-shell -b "if [ -n \"#{client_activity}\" ]; then tmux -S \"#{socket_path}\" set-option -w -t \"#{window_id}\" @last_viewed \"#{client_activity}\"; fi"'
